

name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SQLITE_PATH: /tmp/iot-ci.sqlite3
      FRONTEND_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 2

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker build context
        run: |
          test -f api/manage.py
          test -f api/entrypoint.sh
          test -f api/requirements.txt
          test -f api/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          load: true
          no-cache: true
          tags: iot-backend:ci

      - name: Start container
        run: |
          docker run -d --name iot-api-ci \
            -e SECRET_KEY=ci-only-secret-key \
            -e DEBUG=true \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SQLITE_PATH=/tmp/iot-ci.sqlite3 \
            -e FRONTEND_URL=http://localhost:8080 \
            -p 8000:8000 \
            iot-backend:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health/; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs iot-api-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f iot-api-ci || true
=localhost,127.0.0.1 \
          -e FRONTEND_URL=http://localhost:8080 \
          -p 8000:8000 \
          iot-backend:ci

        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/health/; then
            docker rm -f iot-api-ci
            exit 0
          fi
          sleep 2
        done

        docker logs iot-api-ci
        docker rm -f iot-api-ci || true
        exit 1

