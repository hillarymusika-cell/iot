
docker:
  runs-on: ubuntu-latest
  needs: backend

  steps:
    - uses: actions/checkout@v4

    - name: Inspect Docker build context
      run: |
        echo "Checking API files"
        test -f api/manage.py
        test -f api/entrypoint.sh
        test -f api/requirements.txt
        test -f api/Dockerfile
        echo "All required files exist"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: ./api
        file: ./api/Dockerfile
        push: false
        load: true
        no-cache: true
        tags: iot-backend:ci

    - name: Smoke-test container
      run: |
        docker run -d --name iot-api-ci \
          -e SECRET_KEY=ci-secret-key \
          -e DEBUG=true \
          -e ALLOWED_HOSTS=localhost,127.0.0.1 \
          -e FRONTEND_URL=http://localhost:8080 \
          -p 8000:8000 \
          iot-backend:ci

        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/health/; then
            docker rm -f iot-api-ci
            exit 0
          fi
          sleep 2
        done

        docker logs iot-api-ci
        docker rm -f iot-api-ci || true
        exit 1

