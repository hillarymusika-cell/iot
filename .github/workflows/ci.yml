

name: CI
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  
jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SQLITE_PATH: /tmp/iot-ci.sqlite3
      FRONTEND_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Django system checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 2

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        include:
          - name: backend
            context: ./api
            file: ./api/Dockerfile
            image: iot-backend:ci
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: iot-frontend:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker build context
        run: |
          test -f api/manage.py
          test -f api/entrypoint.sh
          test -f api/requirements.txt
          test -f api/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
