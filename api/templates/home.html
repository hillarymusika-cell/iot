<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5ee" />
    <meta name="description" content="Welcome to Apex Sensor Studio." />
    <title>Apex Sensor Studio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #23332d;
        background: #f5f5ee;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 82% 8%, #dce8cf 0, transparent 34rem),
          #f5f5ee;
      }

      main {
        width: min(100% - 2.5rem, 960px);
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      header, .actions {
        display: flex;
        align-items: center;
      }

      header { justify-content: space-between; }

      .brand {
        color: #23332d;
        font-size: 1.15rem;
        font-weight: 750;
        letter-spacing: -.04em;
        text-decoration: none;
      }

      .brand span { color: #638256; }

      .badge {
        border: 1px solid #d5ddcf;
        border-radius: 999px;
        padding: .45rem .75rem;
        color: #53644c;
        font-size: .75rem;
        font-weight: 650;
      }

      .hero {
        max-width: 700px;
        padding: clamp(4.5rem, 12vw, 8rem) 0 3.5rem;
      }

      .eyebrow {
        color: #638256;
        font-size: .75rem;
        font-weight: 750;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      h1 {
        margin: .8rem 0 1rem;
        font-family: Georgia, serif;
        font-size: clamp(2.8rem, 7vw, 5rem);
        font-weight: 500;
        letter-spacing: -.055em;
        line-height: 1.03;
      }

      .intro {
        max-width: 560px;
        color: #65716a;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .actions { flex-wrap: wrap; gap: .75rem; margin-top: 1.8rem; }

      .button {
        display: inline-flex;
        min-height: 2.8rem;
        align-items: center;
        justify-content: center;
        border: 1px solid #d5ddcf;
        border-radius: .55rem;
        padding: .65rem 1rem;
        color: #35473c;
        font-size: .9rem;
        font-weight: 650;
        text-decoration: none;
      }

      .button-primary {
        border-color: #3c6348;
        background: #3c6348;
        color: white;
      }

      .button:hover { border-color: #91a688; background: white; }
      .button-primary:hover { border-color: #2e5035; background: #2e5035; }
      a:focus-visible { outline: 3px solid #9db58e; outline-offset: 3px; }

      footer {
        margin-top: 3rem;
        color: #7a847d;
        font-size: .8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/">apex<span>.</span></a>
        <span class="badge">SENSOR STUDIO</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow">Soil moisture monitoring</div>
        <h1 id="page-title">A clearer view of your growing environment.</h1>
        <p class="intro">
          Monitor live sensor readings, follow moisture trends, and manage the
          devices connected to your growing space.
        </p>
        <div class="actions">
          <a class="button button-primary" href="{{ dashboard_url }}/?auth=signup">Create account</a>
          <a class="button" href="{{ dashboard_url }}/?view=analytics">View analytics</a>
        </div>
      </section>

      <footer>Apex Sensor Studio · Live data from your connected sensors</footer>
    </main>
  </body>
</html>
