server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (fine behind TLS terminator too)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # App assets — short cache so API-base fixes deploy immediately
    location /src/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Local Docker Compose only: proxy /api to the backend service.
    # On Render the JS calls https://firmwarebackend.onrender.com directly.
    # Keep this block for compose; if backend is unresolved, return JSON 502
    # instead of HTML so the UI does not show JSON.parse errors.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"detail":"API proxy unavailable. Use the hosted backend URL."}';
    }

    location = /health/ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    server_tokens off;
}
